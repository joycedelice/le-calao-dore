<section id="temoignages" class="testimonials-section py-5 " style="background-color: #E9B824 ;"> 
  <div class="container py-5 "> 
    <div class="temoignages-title d-flex align-items-center justify-content-center mb-5">
      <hr class="line-red flex-grow-1 ">
      <h2 class="mx-3">Ce qu'ils en disent</h2>
      <hr class="line-red flex-grow-1">
    </div>
    
  
    <div class="row"> 
      @for (t of testimonials; track t.id) { 
        <div class="col-12 col-md-4 mb-3"> 
          <div class="testimonial-card p-4" 
               [class.bg-success]="t.rating > 3" 
               [class.bg-warning]="t.rating === 3" 
               [class.bg-danger]="t.rating < 3"> 
            <div class="stars mb-2"> 
              @for (star of getStars(t.rating); track $index) { 
                <span>⭐</span> 
              } 
            </div> 
  
            <p class="testimonial-text">{{ t.text }}</p> 
            <p class="testimonial-author fw-bold">— {{ t.name }}</p> 
          </div> 
        </div> 
      } 
    </div> 
  </div> 
</section>
