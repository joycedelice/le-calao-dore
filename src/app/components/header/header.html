<header class="bg-header w-100 " style=" min-height: 80px;">
    <div class="container-fluid d-flex justify-content-between align-items-center w-100 px-3 py-2">

        <div class="logo d-flex flex-column">
            <img src="images/logo.png" alt=" logo" style="border-radius: 90%; width: 250px; height: 100px;">
            <p style="color: rgba(224, 230, 235, 0.547);">cuisine camerounaise authentique </p>
        </div>
        <div class="d-flex flex-column flex-md-row align-items-center text-white">

            <button type="button" class="burger rounded p-2 ms-auto d-md-none "
                style="border: none;  z-index: 20; position: relative; background:none; color:white; font-size: 1.5rem ; font-weight: bold; cursor: pointer;"
                (click)="toggleMenu()">
                ☰
            </button>

            <div class="mobile-overlay d-none d-md-none" [class.d-flex]="isMenuOpen" [class.d-none]="!isMenuOpen"
                (click)="toggleMenu()">
                <nav class="mobile-nav flex-column gap-5 text-center" (click)="$event.stopPropagation()">
                    @for (link of links; track link) {
                    <a [href]="'#' + link.toLowerCase()" [class.active]="activeLink === link" (click)="setActive(link)"
                        class="nav-link cursor-pointer fs-6">
                        {{ link }}
                    </a>
                    }
                </nav>
            </div>

            @if (isMenuOpen || !isMobile) {
            <nav class="d-none d-md-flex flex-md-row gap-5">
                @for (link of links; track link) {
                <a [href]="'#' + link.toLowerCase()" [class.active]="activeLink === link" (click)="setActive(link)"
                    class="nav-link cursor-pointer fs-6">
                    {{ link }}
                </a>
                }
            </nav>
            }
        </div>
    </div>
</header>
